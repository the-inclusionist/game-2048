<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048 · Potência de 2</title>
<!--
  THE SHELL, and it is a contract before it is a page.

  The engine REQUIRES markup with fixed ids and, when it is missing, the panels open EMPTY — with no error.
  That was the second consumer's finding 6, and the fix on the engine's side was to return the list in
  `problems` instead of leaving every game to rediscover it. What this file delivers:

    · `#sr-status` / `#sr-alert` — the pair of live regions `core/a11y-sr` looks for. Polite and assertive.
    · `#stage-wrap` / `#stage` / `#game-region` — what `ui/layout` measures and scales.
    · `#cvd` — an EMPTY `<svg>`. `installCvdFilters()` fills it at run time, so this game copies not one line
      of the engine's markup (finding 7).
    · the ids of the typography panel, which is borrowed whole.

  ⚠️ AND `#game-region` DOES NOT CONTAIN THE BOARD IN THE HTML. The canvas and the `role="grid"` grid are built
  by `boot/main.ts`, because both layers read the SAME geometry (`app/js/geometry.ts`) and duplicating it here
  would create the second version that drifts on the first adjustment.
-->
<link rel="stylesheet" href="/vendor/fonts.css">
<link rel="stylesheet" href="./css/game.css">
</head>
<body>
  <p id="sr-status" class="sr-only" role="status" aria-live="polite"></p>
  <p id="sr-alert" class="sr-only" role="alert" aria-live="assertive"></p>

  <main>
    <div id="stage-wrap" class="stage-wrap">
      <div id="stage" class="stage">
        <section id="game-region" class="game-region" tabindex="-1" aria-label="2048 · Potência de 2">
          <!-- THE HUD COLUMN, to the left of the board. Somebody reading left to right meets what the round
               asks first — and it is the same order in which the screen reader narrates. -->
          <div id="p2-hud" class="p2-hud">
            <h1 class="p2-hud__title" data-i18n="game.title">2048 · Potência de 2</h1>
            <p class="p2-hud__line"><span data-i18n="hud.objective">Chegue à peça 2048</span></p>
            <p class="p2-hud__line"><span data-i18n="hud.score">Pontos</span>: <b id="p2-score">0</b></p>
            <p class="p2-hud__line" id="p2-doubles">0 de 11 dobras.</p>
            <button id="p2-again" class="p2-btn" type="button" data-i18n="end.again">Jogar outra vez</button>
          </div>

          <!-- THE FOUR TOUCH TARGETS. They exist for whoever does not swipe and for whoever plays with a
               single pointer; the engine's `padPxPerMm` sizes them in REAL millimetres (WCAG 2.5.5).

               ⚠️ THE `aria-label`s ARE TRANSLATED NOW, and until 2026-09-11 they were not: the sentences were
               hardcoded in Portuguese here, so a child playing in English or Spanish heard the touch buttons
               in a language she may not read. `data-i18n-aria` is the engine's own hook (`core/i18n` applies
               it alongside `data-i18n`), and the keys are the SAME ones `app/js/actions.ts` gives the engine
               for naming the keyboard positions — one sentence, one place, two surfaces.

               The Portuguese stays in the attribute as the pre-translation fallback, exactly as `data-i18n`
               does for the visible text above. -->
          <div class="p2-pad" aria-hidden="false">
            <button class="p2-pad-btn p2-pad-btn--up" type="button" data-dir="up" data-i18n-aria="act.up" aria-label="Empurrar para cima">▲</button>
            <button class="p2-pad-btn p2-pad-btn--left" type="button" data-dir="left" data-i18n-aria="act.left" aria-label="Empurrar para a esquerda">◀</button>
            <button class="p2-pad-btn p2-pad-btn--right" type="button" data-dir="right" data-i18n-aria="act.right" aria-label="Empurrar para a direita">▶</button>
            <button class="p2-pad-btn p2-pad-btn--down" type="button" data-dir="down" data-i18n-aria="act.down" aria-label="Empurrar para baixo">▼</button>
          </div>
        </section>
      </div>
    </div>

    <!-- THE ENGINE'S ACCESSIBILITY BAR HANGS HERE, and the element is EMPTY on purpose: `createGame` writes
         and wires the buttons since engine 8.0.0. Blind mode, TTS, Libras and the TEA/calm level arrive
         without this game writing one of them — and before that release none of the four was reachable here
         at all.

         ⚠️ AND THE ID IS OURS, NOT THE ENGINE'S `#title-icons`. Measured in the browser: the engine's
         stylesheet styles that id as `position:absolute; top:10px; left:50%`, which is the PLATFORMER'S title
         screen — the bar floating over the title art. Here `main` is the containing block, so the bar landed
         on top of the HUD, and `elementFromPoint` over the score column returned a `.pi-btn`. It is the same
         defect shape as the canvas that once painted over this HUD.

         Using our own id takes the layout back and keeps everything else: `.pi-btn` is styled by class, so
         the buttons arrive fully dressed. This is what `a11yBarHost` is for, in the engine's own words — it
         can offer the icons, but it cannot guess where they fit in another game's design. -->
    <div id="p2-a11y" class="p2-a11y"></div>

    <!-- OUTSIDE #game-region, so it does NOT scale with k: text always 16px and targets 44px, as the engine's
         `ui/layout` decided for everything that is not the game's world.

         ⚠️ THESE THREE STAY OURS — FOR NOW, AND THE REASON CHANGED UNDER THEM. The engine's bar has a 🌗
         and a 🚥 too, but `iconesQueAccionam` only mounts an icon that has somebody to action it: the
         contrast icon needs `setTemaDoJogador` and the colour-vision icon needs `setCorrecaoDoJogador`.
         Against engine 8.0.0 `createGame` passed neither AND OFFERED NO WAY to supply them, so keeping our
         own was the only honest option.

         ✅ ENGINE 9.0.0 ADDED BOTH FIELDS, so the doors exist — and measuring them found a different wall
         behind each. 🌗 CONTRAST: the axis offers `hc3`/`hc45`/`hc7`, three levels named after a RATIO, and
         `hc7` is not hard but IMPOSSIBLE — three roles pairwise at 7:1 need 49:1 between the extremes and
         the scale stops at 21. 🚥 COLOUR VISION: the write door opened, the READ door did not — the icon
         takes its current value from `players`, typed «esquema de teclas e nada mais», so it would read the
         default on every click and stick after one. Both are gated in `tests/visual.node.test.ts` and
         explained in `app/js/visual.ts`.

         The high contrast here is also not the engine's: it repaints by the contract's ROLE (field 2), which
         is the quiz's finding 8 — the engine's `hcnew` modes repaint the platformer's tile textures, and this
         game has no such tiles. -->
    <div class="p2-tools">
      <button id="open-typo" class="p2-btn" type="button">🔤 Tipografia</button>
      <button id="toggle-hc" class="p2-btn" type="button" aria-pressed="false">◐ Alto contraste</button>
    </div>

    <!-- COLOUR-VISION CORRECTION, AS VISIBLE ROWS. It was a `<select>` until 2026-09-11, and the engine's own
         `ui/visual-axes-panel` records why that shape was wrong, in the Dev's words: inside a closed box, a
         control whose reason to exist is to be FOUND by someone who sees poorly is "almost the same as not
         having moved it".

         EMPTY on purpose: `boot/boot.ts` fills it with the engine's `linhasDoEixo`, so this game does not
         invent a second look for a control the rest of the catalogue already has. The heading's text comes
         from the engine's dictionary too, which is why it carries `data-i18n` and not a sentence. -->
    <section class="p2-viz" aria-labelledby="p2-viz-title">
      <h2 class="p2-viz__title" id="p2-viz-title" data-i18n="eixo.correcao.titulo">Correção de cor</h2>
      <div id="p2-viz" class="ctrl-list" role="radiogroup" aria-labelledby="p2-viz-title"></div>
    </section>
    <svg id="cvd" aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute"></svg>

    <div id="typo" class="overlay" hidden>
      <div class="overlay__card" role="dialog" aria-modal="true" aria-labelledby="typo-title">
        <h2 id="typo-title">Tipografia</h2>
        <div id="typo-preview" class="typo-preview">Juiz foge e bota fita de cetim na xícara</div>
        <div id="typo-list" class="ctrl-list" role="group" aria-label="Fontes"></div>
        <div class="overlay__actions">
          <button id="typo-reset" class="mode-btn" type="button" data-i18n="menu.restoreDefaults">Restaurar padrões deste menu</button>
          <button id="typo-close" class="mode-btn is-on" type="button">Fechar</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./js/boot/boot.ts"></script>
</body>
</html>
