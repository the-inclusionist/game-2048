<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 📌 THE SHARED ORIGIN'S ROOT (D3 of Part Four). CF Pages serves this game at
     `o-inclusionista.jrocha.dev.br/game-2048/`, and the shared `incl-pesados-v2` cache (ADR-0117) lives at
     the origin ROOT — not under this subpath. `<base href="/" />` points every unqualified relative URL
     against the origin root, so `/vendor/fonts.css` and the engine's `/heavy/<host><path>` land where every
     other game on the catalogue finds them. Vite's absolute `src=`/`href=` references the production build
     writes (D2) are not affected: they resolve against the ORIGIN too and keep the `/game-2048/` prefix. -->
<base href="/" />
<title>2048 · Potência de 2</title>
<!--
  THE SHELL, and it is a contract before it is a page.

  The engine REQUIRES markup with fixed ids and, when it is missing, the panels open EMPTY — with no error.
  That was the second consumer's finding 6, and the fix on the engine's side was to return the list in
  `problems` instead of leaving every game to rediscover it. What this file delivers:

    · `#sr-status` / `#sr-alert` — the pair of live regions `core/a11y-sr` looks for. Polite and assertive.
    · `#stage-wrap` / `#stage` / `#game-region` — what `ui/layout` measures and scales.
    · `#cvd` — an EMPTY `<svg>`. `installCvdFilters()` fills it at run time, so this game copies not one line
      of the engine's markup (finding 7).
    · `#title-icons` — an EMPTY `<div>` inside `#game-region`, the engine's own id for the accessibility bar.
      It once read "the ids of the typography panel, which is borrowed whole"; the panel went back to the
      engine on 2026-10-03 (Part Five, E1) and the bar came home to its own id (E2).

  ⚠️ AND `#game-region` DOES NOT CONTAIN THE BOARD IN THE HTML. The canvas and the `role="grid"` grid are built
  by `boot/main.ts`, because both layers read the SAME geometry (`app/js/geometry.ts`) and duplicating it here
  would create the second version that drifts on the first adjustment.
-->
<link rel="stylesheet" href="/vendor/fonts.css">
<link rel="stylesheet" href="./css/game.css">
</head>
<body>
  <p id="sr-status" class="sr-only" role="status" aria-live="polite"></p>
  <p id="sr-alert" class="sr-only" role="alert" aria-live="assertive"></p>

  <main>
    <div id="stage-wrap" class="stage-wrap">
      <div id="stage" class="stage">
        <section id="game-region" class="game-region" tabindex="-1" aria-label="2048 · Potência de 2">
          <!-- THE HUD COLUMN, to the left of the board. Somebody reading left to right meets what the round
               asks first — and it is the same order in which the screen reader narrates. -->
          <div id="p2-hud" class="p2-hud">
            <h1 class="p2-hud__title" data-i18n="game.title">2048 · Potência de 2</h1>
            <p class="p2-hud__line"><span data-i18n="hud.objective">Chegue à peça 2048</span></p>
            <!-- 🔴 THE SCORE AND THE DOUBLES LEFT ON 2026-10-03 — the engine's HUD bands have them now
                 (ADR-0168/0175, declared in `app/js/boot/main.ts`). They were `<b id="p2-score">` and
                 `<p id="p2-doubles">`, rewritten by this game on every draw. 📏 The engine's own note names
                 this exact situation: «six sibling games, six HUDs of their own, none in the bands».
                 The score is five digits with an `aria-label` saying «12 pontos» now, instead of a listener
                 hearing «zero zero zero um dois» (ADR-0238). -->
            <button id="p2-again" class="p2-btn" type="button" data-i18n="end.again">Jogar outra vez</button>
          </div>

          <!-- 🔴 FOUR TOUCH BUTTONS STOOD HERE UNTIL 2026-10-03, and the engine mounts the pad now. The
               cartridge asks for it with `onScreenPad: true` (ADR-0166) and `input/touch.initTouch` writes
               it: sized in real millimetres, named from this game's own `preset`, remappable, and — the part
               ours could never have — pressing `engine.controller`, so the pad goes through the same door as
               the gamepad, the eyes, the face, the voice and the one-button scan.

               Ours were `<button data-dir="up">` with their own CSS, their own `click` handlers in
               `boot/main.ts` and their own sizing call in `src/standalone.ts`. The Dev, on the fourth thing
               of this shape in one week: «Não é para usar meios próprios de entender controle».

               📌 THEIR `aria-label`s ARE NOT LOST. `data-i18n-aria` pointed at `act.up`/`act.down`/
               `act.left`/`act.right`, which are the SAME keys `criarPreset()` gives the engine — so the
               engine's pad names its buttons from the dictionary entries that already existed, and the
               sentence a child hears is unchanged in all three languages. -->

          <!-- THE ENGINE'S ACCESSIBILITY BAR, and the element is EMPTY on purpose: `createGame` writes and wires
               every button. Blind mode, TTS, Libras, the TEA/calm level, the typography cycle and the language
               arrive without this game writing one of them.

               ⚠️ IT MOVED HERE ON 2026-10-03, FROM A `#p2-a11y` OF OUR OWN UNDER `<main>` (Part Five, E2). The
               old note said the engine's `#title-icons` rule was "the platformer's title screen" and that our own
               id "takes the layout back and keeps everything else". Both halves were wrong, and each cost the
               child something measurable:

                 · The rule is `position:absolute; top:0; left:50%` against the nearest POSITIONED ancestor, and
                   `.game-region` is `position:relative`. Inside the region it anchors to the region — which is
                   what ADR-0148 §3 describes and what `ui/top-band.reserveTopBand` measures. Outside it, `main`
                   was the containing block, which is the defect the old note diagnosed correctly and then fixed
                   on the wrong side.
                 · `.pi-btn` is sized by `--alvo-min`, and `ui/layout` writes that variable ON THE REGION
                   (`ui/layout.js:95`, 22·k px). Outside the region the variable was out of scope and every icon
                   fell back to a literal 44 px, so the bar stopped growing with the scale while the board grew.
                 · The engine measured the bar wherever it was and wrote `--barra-a11y-h` on the region
                   accordingly. 📏 Measured on the live deploy with the bar under `<main>`: 375 px of reservation
                   on a region 171 px tall. A nonsense number, written every frame, read by nobody.

               🔴 AND OUR `.p2-a11y` RULE IS WHAT MADE THE ICONS UNCLICKABLE. It was `display:flex; flex-wrap:
               wrap`, which made the engine's `<p class="pause-icons-cap">` — the line naming the pointed icon —
               an ordinary flex ITEM. Its text changes width on every hover, the wrapping row reflows, and the
               icons slide sideways from under the cursor: 📏 hovering `idioma` moved it from x=260 to x=121, 139
               px out. The engine's own rule has the caption `position:absolute; top:100%; pointer-events:none`
               and the row `flex-wrap:nowrap` — out of flow, below the bar, and incapable of moving anything.
               The Dev, finding it: «a pior parte foi a mensagem que deveria aparecer embaixo do painel aparecendo
               no mouse». -->
          <div class="pause-icons" id="title-icons" role="group" aria-label="Atalhos de acessibilidade" data-i18n-aria="a11y.shortcuts"></div>
        </section>
      </div>
    </div>

    <!-- 🔴 THE LAST BUTTON OF THIS GAME'S OWN TOOLBAR WENT ON 2026-10-03, and the row with it.

         Four stood here in Part One. E1 deleted three of them — 🔤 typography, 🚥 colour correction and
         ⌨ keys — once it was measured that engine 11.0.0 mounts every one itself. The fourth, `◐ Alto
         contraste`, was KEPT, with an argument written out at length right here and gated in
         `tests/visual.node.test.ts`: the engine's axis is `hc3`/`hc45`/`hc7`, three levels named after a
         ratio, and `hc7` was «not hard but IMPOSSIBLE» because three roles pairwise at 7:1 need 49:1
         between the extremes while the WCAG scale stops at 21.

         The Dev: «Por que ainda há botão de alto contraste na parte de baixo da tela? Isso é redundante,
         não?»

         📏 THE ARITHMETIC WAS RIGHT AND THE QUESTION WAS WRONG. The engine states what the levels mean, in
         the sentences a child reads (`i18n/en.js:570`): «platform vs background ~3:1», «lighter platforms
         and a darker background», «almost black and white». FIGURE against BACKGROUND — one pair — never
         role against role. Measured with this game's own `contraste()`: `hc7` reaches 21.00:1 for the goal
         tile and 16.06:1 for structure. Not impossible; not even tight.

         🔴 AND THE ENGINE WAS NEVER OFFERING NOTHING. `iconsThatAct` mounts the 🌗 icon for whoever hands in
         `setPlayerTheme`, and this cartridge handed in none — so the axis was missing because of us. The
         engine's own words for this shape: «a gap the consumer reads as a choice is the worst kind».

         `src/index.ts` declares the writer now, the icon is in the bar at the top with the other twelve, and
         the palette lives in `app/js/render/palette.ts` with the four pairs it has to satisfy. -->

    <svg id="cvd" aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute"></svg>
  </main>

  <script type="module" src="../src/standalone.ts"></script>
</body>
</html>
