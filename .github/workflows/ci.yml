# SPDX-License-Identifier: AGPL-3.0-or-later
#
# THE CALLER — and it is short on purpose (ADR-0068 §4).
#
# The gate itself lives once, in the engine repository, and every game invokes it. Copying it here would
# create the failure that record refuses: three hundred copies drift, and the ones that drift silently are
# the ones that stop gating. This file is allowed to grow only in the `with:` block.
#
# `a11y: true` since 2026-09-05, and the line above used to read `false` with a promise attached: the axe
# gate needs a game that can be SERVED, and this repository was a scaffold. It stopped being one, so the debt
# is paid in the same commit that made it payable — a scaffold README and a disabled gate are the same kind
# of lie, and both are removed by the commit that falsifies them (ADR-0067 §3 applied to CI).
#
# ⚠️ THE GATE HAS NO EXCLUSIONS. The engine's own excludes the VLibras widget, whose markup is a third
# party's; this game does not load it, so nothing here is exempt. Proven able to fail before being trusted:
# a page with a missing `alt` and a 1.4:1 text pair makes it report `image-alt` and `color-contrast`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: the-inclusionist/the-inclusionist-engine/.github/workflows/game-ci.yml@main
    with:
      a11y: true
